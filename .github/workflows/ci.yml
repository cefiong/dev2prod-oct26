name: CI_CD

on: 
  push:
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build docker image
        run: | 
          docker build -t polls-api:latest . --platform linux/amd64
      
      - name: Run docker image
        run: |
          docker run -d --name polls-api -p 5001:5001 polls-api:latest
          sleep 5
          curl http://localhost:5001/api/health
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt 
      
      - name: Run test
        run: |
          pytest -v
      
      - name: Stop and remove container
        if: always()
        run: |
          docker stop polls-api
          docker rm polls-api
      
      - name: Login to docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_HUB_TOKEN}}
      
      - name: Tag docker image
        run: | 
          docker tag polls-api:latest ${{secrets.DOCKER_USERNAME}}/polls-api:latest
          docker tag polls-api:latest ${{secrets.DOCKER_USERNAME}}/polls-api:${{ github.sha }}
      
      - name: Push to docker hub
        run: | 
          docker push ${{secrets.DOCKER_USERNAME}}/polls-api:latest
          docker push ${{secrets.DOCKER_USERNAME}}/polls-api:${{ github.sha }}
      
      - name: Trigger render deployment
        run: |
          curl -X POST ${{secrets.RENDER_DEPLOY_HOOK}}
      

